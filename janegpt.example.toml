# Copy this file to janegpt.toml, edit it, then run ./janeGPT.
# Account credentials belong in the mail programs' own configuration.
maildir = "~/Maildir"
archive = "Archive" # Relative to maildir unless absolute.
failed = "Failed" # Relative to maildir unless absolute.
admin = "you@example.org"
reply_anyone = false
from = "bot@example.org"
subject = "" # Fallback only when incoming mail has no subject.
interval = "1m" # Use "0s" for a single scan.

# Ollama
model = "llama3.2"
ollama_url = "http://127.0.0.1:11434"
personality = ""

# Each command is an argv array: executable first, then its arguments.
# Use [] for sync_command if another service already updates this Maildir.
sync_command = ["MailSalonSync", "-plain", "sync"]
send_command = ["msmtp", "--", "{recipient}"]
command_timeout = "10m"

# Durable delivery tracking and bounded retries.
state_dir = "~/.local/state/janeGPT"
max_attempts = 5
retry_backoff = "5m" # Doubles after every failure, capped at 24 hours.
completed_retention = "2160h" # Keep delivered-message IDs for 90 days.

# Other receive examples:
# sync_command = ["mbsync", "-a"]
# sync_command = ["offlineimap", "-c", "/home/you/.config/offlineimap/config"]
#
# A sender that reads the recipient from the To header:
# send_command = ["/usr/sbin/sendmail", "-t", "-i"]
#
# {recipient} is replaced only when it is a complete argument.

# Limits (bytes) and webpage fetch timeout.
max_message_bytes = 10485760
max_body_bytes = 2097152
max_attachment_bytes = 131072 # Per decoded text file; oversized files are skipped.
max_attachment_context_bytes = 262144 # Combined UTF-8 text from incoming files.
max_page_bytes = 10485760
max_web_context_bytes = 131072
page_timeout = "30s"

# Optional Zeal documentation: set this to Zeal's Docset storage directory.
# Install docsets in Zeal first. Requires pandoc on PATH.
docsets_dir = ""
# Example: docsets_dir = "~/.local/share/Zeal/Zeal/docsets"
max_tool_context_bytes = 131072

# Optional external tool. All declared inputs are required strings.
# The command reads JSON inputs on stdin and writes a tool-result JSON object.
# [[tools]]
# name = "local_reference"
# description = "Search local reference notes using query."
# command = ["/home/you/bin/local-reference"]
# inputs = ["query"]
# timeout = "2m"
